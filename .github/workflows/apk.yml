name: Clock Bridge APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-36" > /dev/null
      - name: Version matches tag
        if: env.RELEASE == 'true'
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "android:versionName=\"$v\"" android/AndroidManifest.xml || { echo "::error::AndroidManifest versionName is not $v"; exit 1; }
          grep -q "\"version\": \"$v\"" custom_components/samsung_clock_alarm/manifest.json || { echo "::error::manifest.json version is not $v"; exit 1; }
      - name: Signing key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS || 'android' }}
        run: JDK="$JAVA_HOME" SDK="$ANDROID_HOME" REQUIRE_KEYSTORE=${{ env.RELEASE == 'true' && '1' || '0' }} bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ClockBridge
          path: android/out/app.apk
      - name: Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp android/out/app.apk ClockBridge.apk
          cp android/out/app.apk "ClockBridge-$v.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ClockBridge.apk "ClockBridge-$v.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ClockBridge.apk "ClockBridge-$v.apk" --title "$GITHUB_REF_NAME" --generate-notes
          fi
